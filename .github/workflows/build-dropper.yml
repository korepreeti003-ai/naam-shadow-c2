name: Build Dropper APK

on:
  push:
    branches: [ "ccr-af5b32d0-ofbv99", "main" ]
    paths:
      - 'samples/dropper/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK platform 34
        run: |
          # ubuntu-latest runners ship the Android SDK at $ANDROID_SDK_ROOT
          echo "SDK root: $ANDROID_SDK_ROOT"
          # Find sdkmanager — could be in latest/ or a versioned cmdline-tools dir
          SDKMGR=$(find $ANDROID_SDK_ROOT/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias dropper \
            -keypass android \
            -keystore samples/dropper/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt

      - name: Wire signing into build.gradle
        working-directory: samples/dropper
        run: |
          cat >> app/build.gradle << 'GRADLE'

          android.signingConfigs {
              dbg {
                  storeFile     file("../debug.keystore")
                  storePassword "android"
                  keyAlias      "dropper"
                  keyPassword   "android"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.dbg
          GRADLE

      - name: Build release APK
        working-directory: samples/dropper
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dropper-release-apk
          path: samples/dropper/app/build/outputs/apk/release/*.apk
          retention-days: 30
