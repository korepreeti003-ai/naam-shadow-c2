name: Build Shadow-Loc Magisk Module

on:
  push:
    paths:
      - 'magisk-modules/shadow-loc/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Android SDK + NDK ──────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      # ── Build Zygisk .so + shadowlocd for arm64 + arm32 ───────────────────
      - name: Build native components
        run: |
          cd magisk-modules/shadow-loc/src
          # Download Zygisk API header
          curl -fsSL \
            https://raw.githubusercontent.com/topjohnwu/Magisk/master/native/src/include/zygisk.hpp \
            -o include/zygisk.hpp
          # arm64-v8a
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 --parallel
          # armeabi-v7a
          cmake -B build-arm32 \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm32 --parallel
          # Copy outputs
          mkdir -p ../zygisk
          cp build-arm64/libshadow-loc.so ../zygisk/arm64-v8a.so
          cp build-arm32/libshadow-loc.so ../zygisk/armeabi-v7a.so
          # Daemon — arm64 only (most devices)
          cp build-arm64/shadowlocd ../shadowlocd

      # ── Build APK ─────────────────────────────────────────────────────────
      - name: Build companion APK
        run: |
          cd magisk-modules/shadow-loc/app
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
             ../system/priv-app/ShadowLoc/ShadowLoc.apk

      # ── Package Magisk module zip ─────────────────────────────────────────
      - name: Package module zip
        run: |
          cd magisk-modules/shadow-loc
          zip -r9 ../../shadow-loc-magisk.zip \
            module.prop \
            META-INF/ \
            service.sh \
            post-fs-data.sh \
            shadowlocd \
            shadowloc.conf \
            zygisk/ \
            system/
          echo "Built: shadow-loc-magisk.zip"

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: shadow-loc-magisk-module
          path: shadow-loc-magisk.zip
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadow-loc-${{ github.run_number }}
          name: Shadow-Loc v1.0.${{ github.run_number }}
          files: shadow-loc-magisk.zip
          body: |
            ## Shadow Location Spoofer — Magisk Module

            **System-level GPS spoof — all apps, no LSPosed, 24hr daemon**

            ### Install
            1. Flash via Magisk Manager
            2. Edit `/data/local/tmp/shadowloc.conf` with target coordinates
            3. Reboot

            ### Update coordinates at runtime
            ```bash
            # via adb (no reboot needed)
            adb shell "sed -i 's/LAT=.*/LAT=51.5074/' /data/local/tmp/shadowloc.conf"
            adb shell "sed -i 's/LON=.*/LON=-0.1278/' /data/local/tmp/shadowloc.conf"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
