plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.boompanel.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.boompanel.client"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-demo"

        // Backend URL — change before release
        buildConfigField "String", "BACKEND_URL", "\"http://10.0.2.2:3000\""
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "IS_DEMO", "true"
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "demo_watermark", "⚠ DEMO BUILD"
        }
        release {
            buildConfigField "boolean", "IS_DEMO", "false"
            resValue "string", "demo_watermark", ""
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // HTTP
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'org.json:json:20231013'

    // QR code display
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // Image loading (for logo)
    implementation 'io.coil-kt:coil:2.5.0'
}
